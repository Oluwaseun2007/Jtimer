<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Timer — Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590;650;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --primary: #2563EB;
  --primary-hover: #1D4ED8;
  --primary-soft: #EAF1FF;
  --success: #22C55E;
  --success-soft: #E9FBF0;
  --success-dim: #15803D;
  --warning: #F59E0B;
  --warning-soft: #FFF7E8;
  --warning-dim: #B45309;
  --danger: #EF4444;
  --danger-soft: #FEEDEC;
  --danger-dim: #B91C1C;
  --text: #0F172A;
  --text-muted: #6B7280;
  --text-faint: #98A2B3;
  --border: #E5E9F0;
  --border-strong: #D8DEE8;
  --hover: #F1F5F9;
  --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
  --shadow-soft: 0 8px 24px rgba(15,23,42,.06);
  --shadow-large: 0 24px 60px rgba(15,23,42,.14);
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --r-pill: 999px;
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.32,.72,0,1);
}

html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-feature-settings: "cv11", "ss01";
  letter-spacing: -0.006em;
}

/* ---------- Header ---------- */
header {
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(248,250,252,0.82);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-mark svg { width: 16px; height: 16px; }

.brand-title {
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.015em;
  color: var(--text);
  line-height: 1.25;
}

.brand-sub {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  line-height: 1.25;
}

#channel-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  font-weight: 590;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px 6px 9px;
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-xs);
  transition: color .3s var(--ease-out);
}

.dot-live {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px var(--success-soft);
  flex-shrink: 0;
  animation: pulse 2.2s ease-in-out infinite;
}
.dot-live.off { background: #C6CBD4; box-shadow: 0 0 0 3px var(--hover); animation: none; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ---------- Main layout ---------- */
main {
  flex: 1;
  padding: 40px 24px 8px;
  display: flex;
  flex-direction: column;
  gap: 36px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* ---------- Hero preview ---------- */
.preview-section { display: flex; flex-direction: column; gap: 10px; }

.section-eyebrow {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.02em;
  color: var(--text-muted);
  padding: 0 4px;
}

.preview {
  border-radius: 28px;
  padding: 56px 32px 44px;
  background: linear-gradient(165deg, #14181F 0%, #0A0D12 100%);
  border: 1px solid #1E232B;
  box-shadow: var(--shadow-large);
  text-align: center;
  transition: background .55s var(--ease-out), border-color .55s var(--ease-out);
  position: relative;
  overflow: hidden;
}

.preview::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,255,255,0.05), transparent 70%);
  pointer-events: none;
}

.preview.state-green  { background: linear-gradient(165deg, #10190F 0%, #0A100A 100%); border-color: #1D3319; }
.preview.state-yellow { background: linear-gradient(165deg, #1D1509 0%, #120D06 100%); border-color: #3D2C0E; }
.preview.state-red    { background: linear-gradient(165deg, #1D0F0F 0%, #130909 100%); border-color: #3D1717; }

#preview-time {
  font-family: -apple-system, BlinkMacSystemFont, "Inter", monospace;
  font-variant-numeric: tabular-nums;
  font-size: clamp(58px, 9vw, 100px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: #F5F6F8;
  transition: color .45s var(--ease-out);
  position: relative;
}
.state-green  #preview-time { color: var(--success); }
.state-yellow #preview-time { color: var(--warning); }
.state-red    #preview-time { color: var(--danger); }

#preview-status {
  display: inline-block;
  margin-top: 20px;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.07);
  padding: 7px 16px;
  border-radius: var(--r-pill);
  transition: color .45s var(--ease-out), background .45s var(--ease-out);
}
.state-green  #preview-status { color: #8CE0A8; background: rgba(34,197,94,0.14); }
.state-yellow #preview-status { color: #FBCB6E; background: rgba(245,158,11,0.14); }
.state-red    #preview-status { color: #F4A19E; background: rgba(239,68,68,0.16); }

#preview-msg {
  margin-top: 16px;
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  font-weight: 500;
  min-height: 20px;
  letter-spacing: 0.01em;
}

/* ---------- Grouped sections (Settings-style) ---------- */
.section { display: flex; flex-direction: column; gap: 10px; }

.group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xs);
  overflow: hidden;
}

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 18px;
}
.row + .row { border-top: 1px solid var(--border); }

/* ---------- Duration field ---------- */
.duration-field {
  display: flex;
  align-items: stretch;
}
.duration-field .seg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 4px 14px;
  position: relative;
}
.duration-field .seg + .seg { border-left: 1px solid var(--border); }

.duration-field input[type=number] {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  text-align: center;
  font-family: -apple-system, "Inter", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  font-weight: 650;
  color: var(--text);
  padding: 2px 0;
  -moz-appearance: textfield;
  transition: color .15s var(--ease-out);
}
.duration-field input[type=number]::-webkit-outer-spin-button,
.duration-field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
.duration-field .seg:focus-within { background: var(--primary-soft); }
.duration-field input[type=number]:focus { color: var(--primary); }

.seg-label {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 3px;
}

/* ---------- Presets ---------- */
.presets-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 16px 16px;
}
.preset {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  font-weight: 590;
  padding: 8px 15px;
  cursor: pointer;
  text-align: center;
  transition: background .16s var(--ease-out), color .16s var(--ease-out), border-color .16s var(--ease-out), transform .12s var(--ease-spring);
}
.preset:hover { background: var(--primary-soft); color: var(--primary); border-color: #C7DAFC; }
.preset:active { transform: scale(0.94); }
.preset:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- Playback segmented control ---------- */
.controls-bar {
  display: flex;
}
.btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 610;
  letter-spacing: -0.005em;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-faint);
  transition: background .18s var(--ease-out), color .18s var(--ease-out), transform .1s var(--ease-spring);
}
.controls-bar .btn + .btn { border-left: 1px solid var(--border); }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { cursor: not-allowed; color: var(--text-faint); opacity: 0.55; }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

.btn.start:not(:disabled) { background: var(--success-soft); color: var(--success-dim); }
.btn.start:not(:disabled):hover { background: #DAF8E6; }

.btn.pause:not(:disabled) { background: var(--warning-soft); color: var(--warning-dim); }
.btn.pause:not(:disabled):hover { background: #FEF0D2; }

.btn.stop { color: var(--danger-dim); }
.btn.stop:hover { background: var(--danger-soft); }

/* ---------- Warning rows ---------- */
.warn-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.warn-dot.y { background: var(--warning); box-shadow: 0 0 0 4px var(--warning-soft); }
.warn-dot.r { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }

.row label { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }

.stepper {
  display: flex;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.stepper input[type=number] {
  border: none;
  outline: none;
  background: transparent;
  width: 52px;
  text-align: center;
  font-family: -apple-system, "Inter", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 14.5px;
  font-weight: 610;
  color: var(--text);
  padding: 8px 2px;
  -moz-appearance: textfield;
}
.stepper input[type=number]::-webkit-outer-spin-button,
.stepper input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
.stepper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.stepper .unit { font-size: 11.5px; color: var(--text-faint); font-weight: 590; padding-right: 10px; }

/* ---------- Message row ---------- */
.msg-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 12px 18px;
}
.msg-row input[type=text] {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 450;
  padding: 8px 0;
}
.msg-row input[type=text]::placeholder { color: var(--text-faint); }

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .16s var(--ease-out), transform .1s var(--ease-spring), opacity .16s var(--ease-out);
}
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:active { transform: scale(0.9); }
.icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.icon-btn.send { background: var(--primary); color: #fff; }
.icon-btn.send:hover { background: var(--primary-hover); }

.icon-btn.clear { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.icon-btn.clear:hover { background: var(--hover); color: var(--text); }

/* ---------- Open display link ---------- */
.open-display-btn { padding-bottom: 4px; }
.open-display-btn a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--primary);
  font-size: 13.5px;
  font-weight: 590;
  text-decoration: none;
  box-shadow: var(--shadow-xs);
  transition: background .16s var(--ease-out), border-color .16s var(--ease-out), transform .12s var(--ease-spring);
}
.open-display-btn a:hover { background: var(--primary-soft); border-color: #C7DAFC; }
.open-display-btn a:active { transform: scale(0.99); }
.open-display-btn svg { width: 14px; height: 14px; }

footer {
  padding: 22px 20px 36px;
  text-align: center;
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 500;
}

/* ---------- Responsive ---------- */
@media (max-width: 560px) {
  header { padding: 14px 18px; }
  main { padding: 28px 16px 8px; gap: 28px; }
  .preview { padding: 44px 20px 34px; border-radius: 22px; }
  .duration-field input[type=number] { font-size: 24px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </div>
    <div>
      <div class="brand-title">Stage Timer</div>
      <div class="brand-sub">Operator console</div>
    </div>
  </div>
  <div id="channel-status">
    <div class="dot-live off" id="live-dot"></div>
    <span id="live-label">Display not connected</span>
  </div>
</header>

<main>

  <div class="preview-section">
    <div class="preview" id="preview" aria-live="polite">
      <div id="preview-time">00:00</div>
      <div id="preview-status">Ready</div>
      <div id="preview-msg"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-eyebrow">Duration</div>
    <div class="group">
      <div class="duration-field">
        <div class="seg">
          <input type="number" id="inp-h" min="0" max="23" value="0" aria-label="Hours">
          <span class="seg-label">Hours</span>
        </div>
        <div class="seg">
          <input type="number" id="inp-m" min="0" max="59" value="5" aria-label="Minutes">
          <span class="seg-label">Minutes</span>
        </div>
        <div class="seg">
          <input type="number" id="inp-s" min="0" max="59" value="0" aria-label="Seconds">
          <span class="seg-label">Seconds</span>
        </div>
      </div>
      <div class="presets-grid">
        <button class="preset" onclick="setPreset(0,30,0)">30 min</button>
        <button class="preset" onclick="setPreset(0,20,0)">20 min</button>
        <button class="preset" onclick="setPreset(0,15,0)">15 min</button>
        <button class="preset" onclick="setPreset(0,10,0)">10 min</button>
        <button class="preset" onclick="setPreset(0,5,0)">5 min</button>
        <button class="preset" onclick="setPreset(0,3,0)">3 min</button>
        <button class="preset" onclick="setPreset(0,2,0)">2 min</button>
        <button class="preset" onclick="setPreset(0,1,0)">1 min</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-eyebrow">Playback</div>
    <div class="group">
      <div class="controls-bar">
        <button class="btn start" id="btn-start" onclick="startTimer()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Start
        </button>
        <button class="btn pause" id="btn-pause" onclick="pauseTimer()" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          Pause
        </button>
        <button class="btn stop" onclick="resetTimer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Reset
        </button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-eyebrow">Warning thresholds</div>
    <div class="group">
      <div class="row">
        <div class="warn-dot y"></div>
        <label for="warn-yellow">Yellow at</label>
        <div class="stepper">
          <input type="number" id="warn-yellow" value="120" min="1">
          <span class="unit">sec</span>
        </div>
      </div>
      <div class="row">
        <div class="warn-dot r"></div>
        <label for="warn-red">Red at</label>
        <div class="stepper">
          <input type="number" id="warn-red" value="30" min="1">
          <span class="unit">sec</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-eyebrow">Display message</div>
    <div class="group">
      <div class="msg-row">
        <input type="text" id="msg-input" placeholder="INTERMISSION, PLEASE BE SEATED…" maxlength="60">
        <button class="icon-btn send" onclick="sendMessage()" title="Send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
        <button class="icon-btn clear" onclick="clearMessage()" title="Clear" aria-label="Clear message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="open-display-btn">
    <a href="display.html" target="_blank" id="display-link">
      Open display screen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
    </a>
  </div>

</main>

<footer>Runs on Firebase — display screen can be on a different device, as long as both have internet access.</footer>

<script type="module">

import { db, doc, setDoc, onSnapshot } from "./firebase.js";

const timerRef = doc(db, "timer", "current");
const presenceRef = doc(db, "timer", "presence");

let totalSecs = 5 * 60;
let remaining = totalSecs;
let interval = null;
let running = false;
let currentMsg = '';
let lastDisplaySeen = 0;

function pad(n) { return String(n).padStart(2,'0'); }
function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? pad(h)+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec);
}

function getWarnings() {
  return {
    yellow: parseInt(document.getElementById('warn-yellow').value) || 120,
    red: parseInt(document.getElementById('warn-red').value) || 30
  };
}

function getState() {
  if (remaining <= 0) return 'done';
  const w = getWarnings();
  if (remaining <= w.red) return 'red';
  if (remaining <= w.yellow) return 'yellow';
  return 'green';
}

function getStatusText() {
  if (remaining <= 0) return "TIME'S UP";
  if (!running && remaining === totalSecs) return 'READY';
  if (!running) return 'PAUSED';
  const st = getState();
  if (st === 'red') return 'FINAL WARNING';
  if (st === 'yellow') return 'WARNING';
  return 'RUNNING';
}

async function broadcast() {
  try {
    await setDoc(timerRef, {
      remaining,
      totalSecs,
      running,
      state: getState(),
      status: getStatusText(),
      message: currentMsg,
      fmt: remaining > 0 ? fmt(remaining) : '00:00',
      updated: Date.now()
    });
  } catch (err) {
    console.error('Failed to sync timer state:', err);
  }
}

function updatePreview() {
  const st = getState();
  const preview = document.getElementById('preview');
  preview.className = 'preview state-' + (remaining <= 0 ? 'red' : st);
  document.getElementById('preview-time').textContent = remaining > 0 ? fmt(remaining) : '00:00';
  document.getElementById('preview-status').textContent = getStatusText();
  document.getElementById('preview-msg').textContent = currentMsg;
  broadcast();
}

function startTimer() {
  if (running || remaining <= 0) return;
  running = true;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-pause').disabled = false;
  interval = setInterval(() => {
    remaining--;
    updatePreview();
    if (remaining <= 0) {
      clearInterval(interval);
      running = false;
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-pause').disabled = true;
    }
  }, 1000);
  updatePreview();
}

function pauseTimer() {
  if (!running) return;
  clearInterval(interval);
  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  updatePreview();
}

function resetTimer() {
  clearInterval(interval);
  running = false;
  const h = parseInt(document.getElementById('inp-h').value) || 0;
  const m = parseInt(document.getElementById('inp-m').value) || 0;
  const s = parseInt(document.getElementById('inp-s').value) || 0;
  totalSecs = h * 3600 + m * 60 + s;
  remaining = totalSecs;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-pause').disabled = true;
  updatePreview();
}

function setPreset(h, m, s) {
  document.getElementById('inp-h').value = h;
  document.getElementById('inp-m').value = m;
  document.getElementById('inp-s').value = s;
  resetTimer();
}

function sendMessage() {
  currentMsg = document.getElementById('msg-input').value.trim();
  updatePreview();
}

function clearMessage() {
  currentMsg = '';
  document.getElementById('msg-input').value = '';
  updatePreview();
}

// Expose to inline onclick handlers — functions declared in a module
// are not attached to window by default.
window.startTimer = startTimer;
window.pauseTimer = pauseTimer;
window.resetTimer = resetTimer;
window.setPreset = setPreset;
window.sendMessage = sendMessage;
window.clearMessage = clearMessage;

['inp-h','inp-m','inp-s'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { if (!running) resetTimer(); });
});

// Display connection status: the display page writes a heartbeat to
// timer/presence every couple seconds. We watch it here and treat the
// display as "offline" if we haven't heard from it recently.
onSnapshot(presenceRef, (snap) => {
  if (snap.exists()) {
    lastDisplaySeen = snap.data().lastSeen || 0;
  }
}, (err) => console.error('Presence listener error:', err));

setInterval(() => {
  const connected = (Date.now() - lastDisplaySeen) < 5000;
  document.getElementById('live-dot').classList.toggle('off', !connected);
  document.getElementById('live-label').textContent = connected ? 'Display connected' : 'Display not connected';
}, 1000);

resetTimer();
</script>
</body>
</html>
