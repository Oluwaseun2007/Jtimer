<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Timer — Display</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#050608">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-timer: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --transition: 0.7s cubic-bezier(.16,1,.3,1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #050608;
  transition: background var(--transition);
  font-family: var(--font-ui);
  position: relative;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 55% 42% at 50% 46%, rgba(140,150,170,0.09), transparent 72%);
  transition: background 0.9s var(--ease, cubic-bezier(.16,1,.3,1));
  pointer-events: none;
}

body.green::before  { background: radial-gradient(ellipse 55% 42% at 50% 46%, rgba(151,196,89,0.13), transparent 72%); }
body.yellow::before { background: radial-gradient(ellipse 55% 42% at 50% 46%, rgba(239,159,39,0.14), transparent 72%); }
body.red::before,
body.done::before    { background: radial-gradient(ellipse 55% 42% at 50% 46%, rgba(226,75,74,0.16), transparent 72%); }

body.green  { background: #040703; }
body.yellow { background: #080602; }
body.red    { background: #090303; }
body.done   { background: #090303; }

.bar {
  position: absolute; left: 0; right: 0;
  height: 2px;
  background: rgba(255,255,255,0.06);
  transition: background var(--transition);
  z-index: 2;
}
.bar.top { top: 0; }
.bar.bot { bottom: 0; }
.bar .bar-g, .bar .bar-y, .bar .bar-r { display: none; }

body.green  .bar { background: rgba(151,196,89,0.55); }
body.yellow .bar { background: rgba(239,159,39,0.6); }
body.red    .bar, body.done .bar { background: rgba(226,75,74,0.65); }

#timer {
  font-family: var(--font-timer);
  font-variant-numeric: tabular-nums;
  font-size: clamp(92px, 23vw, 300px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: #33363D;
  transition: color var(--transition), text-shadow var(--transition);
  text-align: center;
  padding: 0 2vw;
  position: relative;
  z-index: 1;
}

body.green  #timer { color: #97C459; text-shadow: 0 0 100px rgba(151,196,89,0.22); }
body.yellow #timer { color: #EF9F27; text-shadow: 0 0 100px rgba(239,159,39,0.25); }
body.red    #timer { color: #E24B4A; text-shadow: 0 0 100px rgba(226,75,74,0.28); }
body.done   #timer { color: #E24B4A; text-shadow: 0 0 120px rgba(226,75,74,0.36); }

#status {
  margin-top: 22px;
  font-size: clamp(12px, 1.8vw, 20px);
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #2A2C31;
  transition: color var(--transition);
  text-align: center;
  position: relative;
  z-index: 1;
}
body.green  #status { color: #6FA23C; }
body.yellow #status { color: #C6821E; }
body.red    #status, body.done #status { color: #C8504F; }

#message {
  position: absolute;
  bottom: 58px;
  font-size: clamp(15px, 2.4vw, 30px);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #4B4E56;
  transition: color var(--transition), opacity 0.5s var(--transition);
  text-align: center;
  padding: 0 5vw;
  opacity: 0;
  z-index: 1;
}
#message.visible { opacity: 1; }
body.green  #message { color: #8FBE63; }
body.yellow #message { color: #E8A94A; }
body.red    #message, body.done #message { color: #E2726F; }

/* ---------- Extra time note ---------- */
/* Transient banner that flashes when the operator grants extra time,
   so it reads as intentional rather than the clock glitching. */
#extra-note {
  position: absolute;
  top: 68px;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  padding: 9px 22px;
  border-radius: 999px;
  background: #97C459;
  color: #050608;
  font-family: var(--font-ui);
  font-size: clamp(13px, 1.6vw, 18px);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0;
  z-index: 2;
  transition: opacity 0.4s var(--transition), transform 0.4s var(--transition);
  pointer-events: none;
}
#extra-note.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Blank screen ---------- */
/* An operator safety valve for on-air mistakes — hides everything but
   keeps the Firestore connection alive underneath, so un-blanking is
   instant and doesn't need a reconnect. */
body.blank #timer, body.blank #status, body.blank #message,
body.blank #progress-wrap, body.blank #media-overlay,
body.blank .bar, body.blank #extra-note { visibility: hidden; }
body.blank { background: #000; }

#progress-wrap {
  position: absolute;
  top: 26px; right: 30px;
  width: 36px; height: 36px;
  opacity: 0.5;
  z-index: 2;
}
#progress-wrap svg { width: 36px; height: 36px; transform: rotate(-90deg); }
#progress-circle {
  fill: none;
  stroke: #33363D;
  stroke-width: 2;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke var(--transition);
  r: 19; cx: 18; cy: 18;
  stroke-dasharray: 119.4;
  stroke-dashoffset: 0;
}
body.green  #progress-circle { stroke: #97C459; }
body.yellow #progress-circle { stroke: #EF9F27; }
body.red    #progress-circle { stroke: #E24B4A; }

#offline {
  position: absolute;
  top: 24px; left: 30px;
  font-size: 10.5px;
  font-weight: 600;
  color: #202226;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  transition: color 0.5s var(--transition);
  z-index: 2;
  max-width: 40vw;
}
#offline.active { color: #63666f; }

#fullscreen-hint {
  position: absolute;
  bottom: 22px; right: 30px;
  font-size: 10.5px;
  font-weight: 500;
  color: #1C1E22;
  cursor: pointer;
  letter-spacing: 0.07em;
  transition: color 0.3s;
  z-index: 2;
}
#fullscreen-hint:hover { color: #63666f; }

#change-code-hint {
  position: absolute;
  bottom: 22px; left: 30px;
  font-size: 10.5px;
  font-weight: 500;
  color: #1C1E22;
  cursor: pointer;
  letter-spacing: 0.07em;
  transition: color 0.3s;
  z-index: 2;
}
#change-code-hint:hover { color: #63666f; }

@keyframes timesup-pulse {
  0%,100% { opacity: 1; } 50% { opacity: 0.58; }
}
body.done #timer { animation: timesup-pulse 1.6s ease-in-out infinite; }

/* ---------- Display code gate ---------- */
#code-gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #050608;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
}
#code-gate .box {
  width: 100%;
  max-width: 320px;
  text-align: center;
  padding: 0 24px;
}
#code-gate h1 {
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #6B7280;
  margin-bottom: 18px;
}
#code-gate input {
  width: 100%;
  text-align: center;
  text-transform: uppercase;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 14px;
  border: 1px solid #2A2C31;
  border-radius: 12px;
  outline: none;
  background: #0B0D11;
  color: #F5F6F8;
  margin-bottom: 12px;
  font-family: var(--font-timer);
}
#code-gate input:focus { border-color: #97C459; }
#code-gate button {
  width: 100%;
  padding: 13px;
  background: #97C459;
  color: #050608;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
#code-gate .code-error {
  min-height: 18px;
  margin-top: 10px;
  font-size: 12.5px;
  color: #E24B4A;
  font-weight: 600;
}

/* ---------- Media takeover (image/video pushed from operator) ---------- */
#media-overlay {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #000;
}
#media-overlay.active { display: flex; }
#media-overlay::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 38%);
  pointer-events: none;
}
#media-overlay img,
#media-overlay video {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* Shrink the countdown into a legible overlay when media is showing,
   instead of competing with it for the whole screen. */
body.media-mode #timer {
  font-size: clamp(44px, 8vw, 110px);
}
body.media-mode #progress-wrap { opacity: 0.85; }

/* ---------- Tap-for-fullscreen prompt ---------- */
/* Browsers block requestFullscreen() unless it's triggered by a real
   click/tap, so this can't fire on its own after an auto-reconnect
   (e.g. on page load/refresh). Show one clear button instead of
   relying on someone noticing the small corner hint. */
#fs-prompt {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(5,6,8,0.88);
  display: none;
  align-items: center;
  justify-content: center;
}
#fs-prompt.active { display: flex; }
#fs-prompt button {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 26px;
  background: #97C459;
  color: #050608;
  border: none;
  border-radius: 14px;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
#fs-prompt .skip {
  position: absolute;
  bottom: 30px;
  background: none;
  color: #63666f;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px;
  border-radius: 8px;
}
</style>
</head>
<body class="">

<div id="code-gate">
  <div class="box">
    <h1>Stage Timer — Display</h1>
    <input type="text" id="code-input" placeholder="STG-4821" maxlength="12">
    <button id="code-connect-btn">Connect</button>
    <div class="code-error" id="code-error"></div>
  </div>
</div>

<div id="fs-prompt">
  <button id="fs-prompt-btn">⛶ Enter fullscreen</button>
  <button class="skip" id="fs-prompt-skip">Not now</button>
</div>

<div id="media-overlay">
  <img id="media-img" alt="" style="display:none;">
  <video id="media-video" muted loop playsinline style="display:none;"></video>
</div>

<div class="bar top">
  <div class="bar-g"></div>
  <div class="bar-y"></div>
  <div class="bar-r"></div>
</div>

<div id="offline">Waiting for operator</div>

<div id="progress-wrap" aria-hidden="true">
  <svg viewBox="0 0 36 36">
    <circle id="progress-circle" r="19" cx="18" cy="18"></circle>
  </svg>
</div>

<div id="timer" aria-live="polite" aria-label="countdown timer">--:--</div>
<div id="status">Waiting for operator</div>
<div id="message" aria-live="polite"></div>
<div id="extra-note" aria-live="polite"></div>

<div class="bar bot">
  <div class="bar-g"></div>
  <div class="bar-y"></div>
  <div class="bar-r"></div>
</div>

<div id="fullscreen-hint" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶ fullscreen</div>
<div id="change-code-hint" onclick="changeCode()" title="Connect to a different event">⚙ change code</div>

<script type="module">

import { db, doc, getDoc, collection, setDoc, onSnapshot, query, where, getDocs } from "./firebase.js";

const CIRCUMFERENCE = 2 * Math.PI * 19;
const CODE_STORAGE_KEY = 'jtimer_display_event';
const clientId = 'disp-' + Math.random().toString(36).slice(2, 10);

let timerRef = null;
let myPresenceRef = null;
let currentEventId = null;
let unsubscribeTimer = null;

function sendClientPresenceHeartbeat() {
  if (!myPresenceRef || !currentEventId) return;
  setDoc(myPresenceRef, { eventId: currentEventId, type: 'display', lastSeen: Date.now() }).catch((err) => {
    console.error('Failed to send display client presence heartbeat:', err);
  });
}
setInterval(sendClientPresenceHeartbeat, 2000);

const codeGate = document.getElementById('code-gate');
const codeInput = document.getElementById('code-input');
const codeError = document.getElementById('code-error');

async function connectWithCode(codeRaw) {
  codeError.textContent = '';
  const code = (codeRaw || '').trim().toUpperCase();
  if (!code) { codeError.textContent = 'Enter a display code'; return; }
  const btn = document.getElementById('code-connect-btn');
  btn.disabled = true;
  try {
    const snap = await getDocs(query(collection(db, 'events'), where('displayCode', '==', code)));
    if (snap.empty) {
      codeError.textContent = 'No event found with that code';
      return;
    }
    const eventDoc = snap.docs[0];
    localStorage.setItem(CODE_STORAGE_KEY, JSON.stringify({ eventId: eventDoc.id, displayCode: code }));
    connectToEvent(eventDoc.id);
    // This click is a real user gesture, so fullscreen is allowed here
    // even though it isn't on an unattended auto-reconnect.
    enterFullscreen();
  } catch (err) {
    console.error('Failed to connect with code:', err);
    codeError.textContent = 'Could not connect — try again';
  } finally {
    btn.disabled = false;
  }
}

function connectToEvent(eventId) {
  currentEventId = eventId;
  timerRef = doc(db, 'eventData', eventId);
  myPresenceRef = doc(db, 'presence', `${eventId}_${clientId}`);
  codeGate.style.display = 'none';
  sendClientPresenceHeartbeat();
  bindTimerListener();
}

document.getElementById('code-connect-btn').addEventListener('click', () => connectWithCode(codeInput.value));
codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectWithCode(codeInput.value); });

(async function tryAutoConnect() {
  const saved = localStorage.getItem(CODE_STORAGE_KEY);
  if (!saved) { codeInput.focus(); return; }
  try {
    const parsed = JSON.parse(saved);
    const snap = await getDoc(doc(db, 'events', parsed.eventId));
    if (snap.exists() && snap.data().active !== false && snap.data().displayCode === parsed.displayCode) {
      connectToEvent(parsed.eventId);
      // No click happened on this page load, so the browser won't
      // let us go fullscreen automatically — ask instead.
      if (!document.fullscreenElement) showFullscreenPrompt();
      return;
    }
  } catch (err) {
    console.error('Failed to auto-connect saved event:', err);
  }
  localStorage.removeItem(CODE_STORAGE_KEY);
  codeInput.focus();
})();

let offlineTimeout;
let haveEverConnected = false;

// Local mirror of the last known server state. When Firestore updates
// arrive we resync to them (they're authoritative); in between updates,
// or if the connection drops, this keeps counting down on its own so
// the display never just freezes mid-show.
const state = {
  remaining: 0,
  totalSecs: 0,
  running: false,
  message: '',
  warnYellow: 120,
  warnRed: 30,
  blank: false,
  extraNote: '',
  extraNoteAt: 0
};

const mediaOverlay = document.getElementById('media-overlay');
const mediaImg = document.getElementById('media-img');
const mediaVideo = document.getElementById('media-video');
let appliedMediaUrl = '';
let appliedMediaType = '';

function applyMedia(url, type) {
  appliedMediaUrl = url;
  appliedMediaType = type;

  if (!url) {
    document.body.classList.remove('media-mode');
    mediaOverlay.classList.remove('active');
    mediaVideo.pause();
    mediaVideo.removeAttribute('src');
    mediaImg.removeAttribute('src');
    return;
  }

  document.body.classList.add('media-mode');
  mediaOverlay.classList.add('active');

  if (type === 'video') {
    mediaImg.style.display = 'none';
    mediaVideo.style.display = 'block';
    mediaVideo.src = url;
    mediaVideo.play().catch((err) => console.error('Media video play failed:', err));
  } else {
    mediaVideo.pause();
    mediaVideo.style.display = 'none';
    mediaImg.style.display = 'block';
    mediaImg.src = url;
  }
}

function pad(n) { return String(n).padStart(2,'0'); }
function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? pad(h)+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec);
}

function computeState() {
  if (state.remaining <= 0) return 'done';
  if (state.remaining <= state.warnRed) return 'red';
  if (state.remaining <= state.warnYellow) return 'yellow';
  return 'green';
}

function computeStatus() {
  if (state.remaining <= 0) return "TIME'S UP";
  if (!state.running && state.remaining === state.totalSecs) return 'READY';
  if (!state.running) return 'PAUSED';
  const st = computeState();
  if (st === 'red') return 'FINAL WARNING';
  if (st === 'yellow') return 'WARNING';
  return 'RUNNING';
}

function render() {
  const st = computeState();
  document.getElementById('timer').textContent = state.remaining > 0 ? fmt(state.remaining) : '00:00';
  document.getElementById('status').textContent = computeStatus();

  const msgEl = document.getElementById('message');
  if (state.message) {
    msgEl.textContent = state.message;
    msgEl.classList.add('visible');
  } else {
    msgEl.classList.remove('visible');
  }

  document.body.className = (state.remaining <= 0 ? 'done' : st) + (state.blank ? ' blank' : '');

  const pct = state.totalSecs > 0 ? state.remaining / state.totalSecs : 1;
  const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, pct)));
  document.getElementById('progress-circle').style.strokeDashoffset = offset;

  updateExtraNote();
}

// Extra-time note fades on its own after a few seconds — checked on a
// timer rather than only on Firestore updates, so it disappears even
// if the operator makes no further changes while it's showing.
const EXTRA_NOTE_MS = 4500;
function updateExtraNote() {
  const el = document.getElementById('extra-note');
  const recent = state.extraNote && (Date.now() - state.extraNoteAt) < EXTRA_NOTE_MS;
  if (recent) {
    el.textContent = state.extraNote;
    el.classList.add('visible');
  } else {
    el.classList.remove('visible');
  }
}
setInterval(updateExtraNote, 500);

// Local fallback ticker — runs continuously regardless of Firestore
// connectivity. Firestore updates (below) periodically resync it to
// the true operator-side value, correcting any drift.
setInterval(() => {
  if (state.running && state.remaining > 0) {
    state.remaining--;
    if (state.remaining <= 0) {
      state.remaining = 0;
      state.running = false;
    }
    render();
  }
}, 1000);

function bindTimerListener() {
  unsubscribeTimer = onSnapshot(timerRef, (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();

    haveEverConnected = true;
    state.remaining = data.remaining;
    state.totalSecs = data.totalSecs;
    state.running = data.running;
    state.message = data.message || '';
    state.blank = !!data.blank;
    state.extraNote = data.extraNote || '';
    state.extraNoteAt = data.extraNoteAt || 0;
    if (typeof data.warnYellow === 'number') state.warnYellow = data.warnYellow;
    if (typeof data.warnRed === 'number') state.warnRed = data.warnRed;

    const incomingMediaUrl = data.mediaUrl || '';
    const incomingMediaType = data.mediaType || '';
    if (incomingMediaUrl !== appliedMediaUrl || incomingMediaType !== appliedMediaType) {
      applyMedia(incomingMediaUrl, incomingMediaType);
    }

    document.getElementById('offline').classList.remove('active');
    document.getElementById('offline').textContent = 'Waiting for operator';
    clearTimeout(offlineTimeout);
    offlineTimeout = setTimeout(() => {
      // We've stopped hearing from the operator. Keep the local ticker
      // running on the last known state rather than freezing the display.
      document.getElementById('offline').classList.add('active');
      document.getElementById('offline').textContent = 'Operator signal lost — showing last known time';
    }, 5000);

    render();
  }, (err) => console.error('Timer listener error:', err));
}

// Screen wake lock — the single biggest cause of a display going dark
// mid-show is the device just falling asleep. Re-acquire on visibility
// change since the OS releases the lock when the tab is hidden.
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.error('Wake lock request failed:', err);
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// Lets whoever is at the display swap to a different event's code
// without needing to find a URL bar or reload the device — useful
// when the same screen is reused across events.
function changeCode() {
  if (unsubscribeTimer) { unsubscribeTimer(); unsubscribeTimer = null; }
  clearTimeout(offlineTimeout);
  localStorage.removeItem(CODE_STORAGE_KEY);
  currentEventId = null;
  timerRef = null;
  myPresenceRef = null;
  codeError.textContent = '';
  codeInput.value = '';
  codeGate.style.display = 'flex';
  codeInput.focus();
}
window.changeCode = changeCode;

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
window.toggleFullscreen = toggleFullscreen;

function enterFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

const fsPrompt = document.getElementById('fs-prompt');
function showFullscreenPrompt() { fsPrompt.classList.add('active'); }
function hideFullscreenPrompt() { fsPrompt.classList.remove('active'); }

document.getElementById('fs-prompt-btn').addEventListener('click', () => {
  enterFullscreen();
  hideFullscreenPrompt();
});
document.getElementById('fs-prompt-skip').addEventListener('click', hideFullscreenPrompt);
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) hideFullscreenPrompt();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

document.getElementById('progress-circle').style.strokeDasharray = CIRCUMFERENCE;
document.getElementById('progress-circle').style.strokeDashoffset = 0;
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
